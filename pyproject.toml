[build-system]
requires = ["scikit-build-core>=0.10", "numpy>=2.0", "swig>=4.0"]
build-backend = "scikit_build_core.build"


[project]
name = "oapackage"
dynamic = ["version"]
description = "Package to generate and analyse orthogonal arrays, conference designs and optimal designs"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Pieter Eendebak", email = "pieter.eendebak@gmail.com" }
]
keywords = ["orthogonal arrays", "design of experiments", "conference designs", "isomorphism testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "python-dateutil",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest",
    "coverage",
]
doc = [
    "sphinx",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-napoleon",
    "breathe",
]

[project.urls]
Homepage = "http://www.pietereendebak.nl/oapackage/index.html"
Repository = "https://github.com/eendebakpt/oapackage"

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
wheel.packages = ["oapackage"]
wheel.install-dir = "."
cmake.build-type = "Release"
logging.level = "INFO"
ninja.make-fallback = true

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/version.h"
regex = 'const char \*__version__ = "(?P<value>[^"]+)"'

[tool.cibuildwheel]
# CPython 3.13 and later follows from requires-python. Skip PyPy, musl, 32-bit and free-threaded builds.
skip = ["pp*", "*-musllinux_*", "*_i686", "*-win32", "cp3*t-*"]
build-verbosity = 1
test-requires = ["pytest"]
# importlib mode makes the tests import the installed wheel instead of the source tree
test-command = "pytest --import-mode=importlib -o addopts= -p no:cacheprovider {project}/tests"
test-environment = { MPLBACKEND = "Agg" }

[tool.ruff]
lint.select = ["E", "F", "UP", "I"]
lint.ignore = ["UP031" # format specifiers
                ]
line-length = 120
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"doxy2swig.py" = ["E501"]
"misc/performancetest/ptest.py" = ["E741"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["oalib\\.py$"]

[[tool.mypy.overrides]]
module = ["oalib", "oapackage.markup"]
ignore_errors = true

[tool.ty.rules]
possibly-missing-attribute = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"