name: Python tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    env:
      MPLBACKEND: Agg
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build and install
      run: |
        python -m pip install --upgrade pip
        pip install .
        pip install pytest mypy types-python-dateutil jupyter
    - name: Test
      run: pytest --import-mode=importlib -o addopts= -p no:cacheprovider tests
    - name: Type check
      run: mypy -p oapackage --follow-imports skip
    - name: Run example notebooks
      run: |
        for notebook in docs/examples/*.ipynb; do
          echo "::group::$notebook"
          jupyter nbconvert --to notebook --execute --output-dir /tmp/notebooks "$notebook"
          echo "::endgroup::"
        done
