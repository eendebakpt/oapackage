name: Build wheels

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Build sdist
      run: pipx run build --sdist
    - name: Check sdist
      run: pipx run twine check dist/*
    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    steps:
    - uses: actions/checkout@v7
    - name: Build and test wheels
      uses: pypa/cibuildwheel@v4.3.1
      env:
        # Pull requests build one Python version per platform to save time; pushes and tags build all
        CIBW_BUILD: ${{ github.event_name == 'pull_request' && 'cp313-*' || '*' }}
    - uses: actions/upload-artifact@v7
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/*.whl

  upload_pypi:
    name: Upload to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    # Only for version tags, for example v2.7.21
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/OApackage
    permissions:
      id-token: write  # trusted publishing, no API token needed
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: List distributions
      run: ls -l dist
    - uses: pypa/gh-action-pypi-publish@release/v1
