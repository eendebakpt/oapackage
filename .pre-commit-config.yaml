repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: 'v0.14.5'
  hooks:
    # ruff-check and ruff-format also run on Jupyter notebooks
    - id: ruff-check
      args: [--fix, --exit-non-zero-on-fix]
    - id: ruff-format

